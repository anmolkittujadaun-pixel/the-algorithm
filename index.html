<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Algorithm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-card">
    <div class="now-playing"><span class="dot"></span> NOW PLAYING</div>

    <div class="vinyl-wrap">
      <div id="vinyl" class="vinyl"><div class="vinyl-center"></div></div>
    </div>

    <h1 id="appTitle">The Algorithm</h1>
    <p id="albumName" class="album">Sukoon</p>

    <h2 id="songTitle">Select a song</h2>
    <p id="songArtist" class="artist">—</p>

    <div class="progress-row">
      <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
    </div>
    <div class="time-row">
      <span id="curTime">0:00</span>
      <span id="durTime">0:00</span>
    </div>

    <div class="controls">
      <button id="prevBtn" class="ctrl-btn small" aria-label="Previous">⏮</button>
      <button id="playBtn" class="ctrl-btn big" aria-label="Play">▶</button>
      <button id="nextBtn" class="ctrl-btn small" aria-label="Next">⏭</button>
    </div>

    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volBar" min="0" max="1" step="0.01" value="1">
    </div>

    <h3 class="playlist-heading">Radio Playlist</h3>
    <div id="playlist" class="playlist"></div>
  </div>

  <audio id="audio"></audio>

  <script src="songs.js"></script>
  <script src="script.js"></script>
</body>
</html>
