<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Algorithm</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="radio">

    <div class="station">
      <span class="dot"></span>
      NOW PLAYING
    </div>

    <div class="album">
      <div class="record">
        <div class="record-center"></div>
      </div>
    </div>

    <h1>The Algorithm</h1>
    <p class="dedication">Sukoon</p>

    <p class="song">Ye Tune Kya Kiya</p>
    <p class="artist">Javed Bashir</p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <div class="time">
      <span>0:00</span>
      <span>0:00</span>
    </div>

    <div class="controls">
      <button id="previous">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>

    <div class="volume">
      🔊
      <input type="range" min="0" max="100" value="70">
    </div>

    <div class="playlist">
      <h2>Radio Playlist</h2>
      <div id="playlist"></div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
